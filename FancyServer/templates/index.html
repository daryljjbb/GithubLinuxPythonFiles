<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Media Hub Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; }
        .movie-card { background: #222; border-radius: 10px; overflow: hidden; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.03); border: 1px solid #00d4ff; }
        .history-item { font-size: 0.85rem; border-bottom: 1px solid #333; padding: 10px 0; }
        .thumb-img { width: 100%; height: 160px; object-fit: cover; }
        .badge-live { background: #e50914; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 border-bottom border-secondary">
    <span class="navbar-brand">🐧 LINUX PRO HUB</span>
    <span class="text-muted small">CPU: {{ stats.cpu }}% | RAM: {{ stats.ram }}%</span>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <!-- LEFT COLUMN: MEDIA GRID -->
        <div class="col-lg-9">
            <h4 class="mb-4">Your Collection</h4>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                {% for item in items %}
                <div class="col">
                    <div class="movie-card h-100">
                        <img src="{{ url_for('static', filename=item.thumb) }}" class="thumb-img">
                        <div class="p-3">
                            <h6 class="text-truncate">{{ item.name }}</h6>
                            <a href="/stream/{{ item.name }}" class="btn btn-sm btn-outline-info w-100">Stream to Device</a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- RIGHT COLUMN: RECENT HISTORY -->
        <div class="col-lg-3">
            <div class="card bg-dark border-secondary p-3">
                <h5 class="mb-3"><span class="badge badge-live">●</span> Recent Activity</h5>
                {% if history %}
                    {% for h in history %}
                    <div class="history-item">
                        <div class="fw-bold text-info text-truncate">{{ h[0] }}</div>
                        <div class="text-muted smaller">{{ h[1] }}</div>
                    </div>
                    {% endfor %}
                {% else %}
                    <p class="text-muted">No history yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>

</body>
</html>
